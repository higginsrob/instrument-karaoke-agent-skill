<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instrument Karaoke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("instrument-karaoke.theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (e) {
        /* storage or matchMedia unavailable — keep light */
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="#/">Instrument Karaoke</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="#/">Library</a>
      <button type="button" class="site-nav-btn" id="nav-settings" aria-haspopup="dialog">Settings</button>
      <a href="#/admin/queue" id="nav-queue" hidden>Queue</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </nav>
  </header>

  <main id="app" class="app">
    <p class="loading">Loading library…</p>
  </main>

  <script src="assets/markdown.js"></script>
  <script src="assets/chords.js"></script>
  <script src="assets/media-analysis.js"></script>
  <script src="assets/media-player.js"></script>
  <script src="assets/queue.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
